name: release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: arm64, platform: linux/arm64 }
          - { arch: armhf, platform: linux/arm/v7 }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: Build filter + .deb (${{ matrix.arch }})
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=0.0.0-dev; fi
          # Build on bullseye (glibc 2.31) so the binaries also run on older
          # LTS (Ubuntu 20.04/22.04, Debian 11+, Raspberry Pi OS bullseye),
          # not just bookworm/trixie.
          # Bullseye left LTS on 31 Aug 2026 and its security pool is being
          # retired: deb.debian.org still serves the bullseye-security indexes,
          # so apt resolves versions whose .deb files now 404 (deb11u10 cups,
          # deb11u5 perl) and the build dies fetching them. archive.debian.org
          # is not an answer on its own -- it carries bullseye main but no
          # bullseye-security yet, and main alone is older than the packages
          # baked into the base image, so apt reports broken packages.
          # snapshot.debian.org keeps both suites at a fixed date; 1 Sep 2026
          # is the day after the last bullseye update, so it pins the final
          # state. Check-Valid-Until off because a snapshot Release file is
          # deliberately stale.
          SNAP=20260901T000000Z
          docker run --rm --platform=${{ matrix.platform }} -v "$PWD":/src -w /src \
            -e VER="$VER" -e ARCH="${{ matrix.arch }}" -e SNAP="$SNAP" debian:bullseye-slim sh -eux -c '
              rm -f /etc/apt/sources.list.d/*
              {
                echo "deb http://snapshot.debian.org/archive/debian/${SNAP} bullseye main"
                echo "deb http://snapshot.debian.org/archive/debian-security/${SNAP} bullseye-security main"
              } > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=3 update
              apt-get install -y --no-install-recommends build-essential libcups2-dev dpkg-dev file
              make -s
              file src/rastertotspl
              mkdir -p dist
              cp src/rastertotspl dist/rastertotspl-${ARCH}
              sh packaging/deb/build.sh ${ARCH} ${VER} dist
              ls -l dist
            '
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*

  rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: Build .rpm (${{ matrix.arch }})
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=0.0.0; fi
          docker run --rm --platform=${{ matrix.platform }} -v "$PWD":/src -w /src \
            -e VER="$VER" fedora:latest bash -eux -c '
              dnf -y install gcc make cups-devel rpm-build rpmdevtools tar >/dev/null
              rpmdev-setuptree
              tar czf ~/rpmbuild/SOURCES/tspl-cups-driver-${VER}.tar.gz \
                  --transform "s,^,tspl-cups-driver-${VER}/," \
                  src backend ppd Makefile README.md LICENSE
              rpmbuild -bb --define "ver ${VER}" packaging/rpm/tspl-cups-driver.spec
              mkdir -p dist && cp ~/rpmbuild/RPMS/*/*.rpm dist/
              ls -l dist
            '
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*

  # Builds the AUR package in a real Arch container: refresh.sh derives
  # pkgver/sha256/.SRCINFO from the released tarball, then makepkg builds it
  # and runs the test suite via check(). Proves the package installs cleanly
  # before anything is published. Runs on a tag, or on demand against the
  # version currently in the PKGBUILD.
  aur:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: makepkg in archlinux:base-devel
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"
          else VER=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD); fi
          echo "building AUR package for v$VER"
          docker run --rm -v "$PWD":/src:ro -e VER="$VER" archlinux:base-devel bash -eux -c '
            pacman -Syu --noconfirm --needed cups curl >/dev/null
            useradd -m builder
            install -d -o builder /work
            cp -r /src/packaging/aur/. /work/
            chown -R builder /work
            su builder -c "cd /work && sh ./refresh.sh $VER . && makepkg -f --noconfirm --nosign"
            ls -l /work/*.pkg.tar.*
            pacman -Qip /work/*.pkg.tar.* | head -20
            pacman -Qlp /work/*.pkg.tar.*
            cp /work/PKGBUILD /work/.SRCINFO /tmp/ 2>/dev/null || true
          '
      - name: .SRCINFO in the repo matches what refresh.sh generates
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"
          else VER=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD); fi
          docker run --rm -v "$PWD":/src -e VER="$VER" archlinux:base-devel bash -eux -c '
            pacman -Syu --noconfirm --needed curl >/dev/null
            useradd -m builder
            install -d -o builder /work && cp -r /src/packaging/aur/. /work/ && chown -R builder /work
            su builder -c "cd /work && sh ./refresh.sh $VER ."
            # A tag build legitimately differs: main pins the checksum only
            # after the release, so only compare when the repo already has it.
            if grep -q "^sha256sums=(.SKIP.)" /src/packaging/aur/PKGBUILD; then
              echo "repo PKGBUILD still on SKIP, nothing to compare"
            else
              diff -u /src/packaging/aur/PKGBUILD /work/PKGBUILD
              diff -u /src/packaging/aur/.SRCINFO /work/.SRCINFO
              echo "repo copy is in sync"
            fi
          '

  release:
    needs: [ deb, rpm ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: art
      - name: Collect assets
        run: |
          mkdir -p dist
          find art -type f \( -name '*.deb' -o -name '*.rpm' -o -name 'rastertotspl-*' \) -exec cp {} dist/ \;
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt filter binaries (amd64/arm64/armhf), .deb and .rpm packages, built by GitHub Actions. Free driver by Run The Wall — https://constly.com" \
          || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pages:
    needs: [ deb, rpm ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6   # Pages already enabled on the repo (Actions source)
      - uses: actions/download-artifact@v8
        with:
          path: art
      - name: Build signed apt + dnf repos
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c gnupg
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=hello@constly.com
          SIGN="gpg --batch --yes --pinentry-mode loopback -u $KEY"

          mkdir -p site/apt site/rpm
          find art -name '*.deb' -exec cp {} site/apt/ \;
          find art -name '*.rpm' -exec cp {} site/rpm/ \;
          cp packaging/repo/index.html site/index.html

          # --- apt: flat repo, signed Release ---
          ( cd site/apt
            dpkg-scanpackages --multiversion . > Packages
            gzip -9c Packages > Packages.gz
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=RunTheWall \
              -o APT::FTPArchive::Release::Label=tspl-cups-driver \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              release . > Release
            $SIGN --clearsign -o InRelease Release
            $SIGN -abs -o Release.gpg Release )
          gpg --export "$KEY"        > site/apt/KEY.gpg    # dearmored, for signed-by
          gpg --armor --export "$KEY" > site/apt/KEY.asc

          # --- dnf: repodata with signed repomd (repo_gpgcheck) ---
          cp packaging/repo/RPM-GPG-KEY-tspl site/rpm/RPM-GPG-KEY-tspl
          cp packaging/repo/tspl.repo        site/rpm/tspl.repo
          ( cd site/rpm
            createrepo_c .
            $SIGN --detach-sign --armor repodata/repomd.xml )

          echo "=== site tree ===" ; find site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000      # 15 min — GitHub Pages first-deploy can queue slowly
          error_count: 50
